<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <title>Slime Sprint</title>
        <style>
            html, body {
                margin: 0;
                padding: 0;
                height: 100%;
                background: black;
                overflow: hidden;
            }
            canvas {
                display: block;
                width: 100vw;
                height: 100vh;
            }
            #startScreen, #gameOverScreen, #pauseMenu {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0,0,0,0.7);
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                color: white;
                font-family: Arial, sans-serif;
                z-index: 10;
            }
            #gameOverScreen, #pauseMenu {
                display: none;
            }
            button {
                padding: 10px 20px;
                font-size: 20px;
                margin-top: 20px;
                cursor: pointer;
            }
            #scoreDisplay {
                position: fixed;
                top: 10px;
                left: 10px;
                color: white;
                font-family: Arial, sans-serif;
                font-size: 24px;
                z-index: 1001;
                user-select: none;
            }
            #homeButton, #pauseButton {
                position: fixed;
                top: 10px;
                padding: 10px 15px;
                background-color: rgba(0,0,0,0.5);
                color: white;
                border: 1px solid white;
                border-radius: 5px;
                cursor: pointer;
                z-index: 1001;
                user-select: none;
            }
            #homeButton {
                left: 10px;
            }
            #pauseButton {
                right: 10px;
            }
        </style>
    </head>
    <body>
        <canvas id="gameCanvas"></canvas>

        <div id="startScreen">
            <h1>Slime Sprint</h1>
            <p>Drücke Leertaste oder tippe zum Springen!</p>
            <div id="powerSelectContainer" style="display:none; flex-direction:row; gap:20px; margin-bottom:20px;"></div>
            <button id="startButton">Spiel starten</button>
        </div>

        <div id="gameOverScreen">
            <h1>Game Over!</h1>
            <p id="scoreText">Punkte: 0</p>
            <div id="powerSelectContainerGameOver" style="display:none; flex-direction:row; gap:20px; margin-bottom:20px;"></div>
            <button id="restartButton">Nochmal spielen</button>
        </div>

        <div id="pauseMenu">
            <h1>Pause</h1>
            <button id="resumeButton">Weiter</button>
            <button id="pauseHomeButton">Home</button>
        </div>

        <button id="fullscreenButton" style="position: fixed; bottom: 20px; right: 20px; padding: 10px 15px; background-color: rgba(0,0,0,0.5); color: white; border: 1px solid white; border-radius: 5px; cursor: pointer; z-index: 1000;">Fullscreen</button>

        <button id="homeButton" style="display:none;">Home</button>
        <button id="pauseButton" style="display:none;">Pause</button>

        <div id="scoreDisplay" style="display:none;">Punkte: 0</div>

        <script>

            const $ = id => document.getElementById(id);
            
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            const GAME_WIDTH = 1920;
            const GAME_HEIGHT = 1080;

            const canvas = $("gameCanvas");
            const ctx = canvas.getContext("2d");
            canvas.width = GAME_WIDTH;
            canvas.height = GAME_HEIGHT;

            const startScreen = $("startScreen");
            const gameOverScreen = $("gameOverScreen");
            const pauseMenu = $("pauseMenu");

            const startButton = $("startButton");
            const restartButton = $("restartButton");
            const resumeButton = $("resumeButton");
            const pauseHomeButton = $("pauseHomeButton");

            const scoreText = $("scoreText");
            const scoreDisplay = $("scoreDisplay");

            const homeButton = $("homeButton");
            const pauseButton = $("pauseButton");

            const fullscreenButton = $("fullscreenButton");

            const OVERGROUND = GAME_HEIGHT * 0.29296875 - 15;
            let ground = GAME_HEIGHT - OVERGROUND;
            ground -= isMobile ? 55 : 0;

            const slime = {
                x: 50,
                y: GAME_HEIGHT - 300,
                width: isMobile ? 120 : 60,
                height: isMobile ? 120 : 60,
                speed: isMobile ? 10 : 5,
                velocity: 0,
                gravity: isMobile ? 0.6 : 0.3,
                jumpPower: isMobile ? -16 : -8,
                isJumping: false,
                rotation: 0
            };

            let slimeImgs = {
                red: new Image(),
                blue: new Image(),
                lila: new Image(),
                rainbow: new Image(),
                yellow: new Image(),
            };
            slimeImgs.red.src = "assets/slimes/red.png";
            slimeImgs.blue.src = "assets/slimes/blue.png";
            slimeImgs.lila.src = "assets/slimes/lila.png";
            slimeImgs.rainbow.src = "assets/slimes/rainbow.png";
            slimeImgs.yellow.src = "assets/slimes/yellow.png";

            let bucketImgs = {
                red: new Image(),
                blue: new Image(),
                lila: new Image(),
                green: new Image(),
                yellow: new Image(),
                rainbow: new Image(),
                happy_red: new Image(),
                happy_blue: new Image(),
                happy_lila: new Image(),
                happy_rainbow: new Image(),
                happy_yellow: new Image()
            };
            bucketImgs.red.src = "assets/buckets/red.png";
            bucketImgs.blue.src = "assets/buckets/blue.png";
            bucketImgs.lila.src = "assets/buckets/lila.png";
            bucketImgs.green.src = "assets/buckets/green.png";
            bucketImgs.rainbow.src = "assets/buckets/rainbow.png";
            bucketImgs.yellow.src = "assets/buckets/yellow.png";
            bucketImgs.happy_red.src = "assets/buckets/happy_red.png";
            bucketImgs.happy_blue.src = "assets/buckets/happy_blue.png";
            bucketImgs.happy_lila.src = "assets/buckets/happy_lila.png";
            bucketImgs.happy_rainbow.src = "assets/buckets/happy_rainbow.png";
            bucketImgs.happy_yellow.src = "assets/buckets/happy_yellow.png";

            let hindernisImgs = {
                cactus: new Image(),
            };
            hindernisImgs.cactus.src = "assets/obstacles/cactus.png";

            let runner = 0;
            let points = 0;
            let hindernisse = [];
            let buckets = [];
            let gameRunning = false;
            let gamePaused = false;
            let power = undefined;
            let startpowers = [];

            let slimeImage = new Image();
            slimeImage.src = "assets/slime.png";
            let hindernisImg = new Image();
            hindernisImg.src = "assets/hindernis.png";
            let backgroundImg = new Image();
            backgroundImg.src= "assets/background.png";
            let backgroundX = 0;

            let highscore = 0;

            fullscreenButton.addEventListener("click", openFullscreen);

            document.addEventListener("fullscreenchange", () => {
                fullscreenButton.style.display = document.fullscreenElement ? "none" : "block";
            });
            document.addEventListener("webkitfullscreenchange", () => {
                fullscreenButton.style.display = document.webkitFullscreenElement ? "none" : "block";
            });

            homeButton.addEventListener("click", () => {
                if (gameRunning || gamePaused) {
                    gameRunning = false;
                    gamePaused = false;
                    pauseMenu.style.display = "none";
                    scoreDisplay.style.display = "none";
                    homeButton.style.display = "none";
                    pauseButton.style.display = "none";
                    showStartScreen();
                    gameOverScreen.style.display = "none";
                }
            });

            pauseButton.addEventListener("click", () => {
                if (gameRunning) {
                    pauseGame();
                }
            });

            resumeButton.addEventListener("click", () => {
                resumeGame();
            });

            pauseHomeButton.addEventListener("click", () => {
                pauseMenu.style.display = "none";
                gamePaused = false;
                gameRunning = false;
                scoreDisplay.style.display = "none";
                homeButton.style.display = "none";
                pauseButton.style.display = "none";
                showStartScreen();
                gameOverScreen.style.display = "none";
            });

            function checkCollision() {
                const slimeCenterX = slime.x + slime.width / 2;
                const slimeCenterY = slime.y + slime.height / 2;
                const slimeRadius = slime.width / 2;

                for (let i of hindernisse) {
                    const closestX = Math.max(i.x, Math.min(slimeCenterX, i.x + i.width));
                    const closestY = Math.max(i.y, Math.min(slimeCenterY, i.y + i.height));
                    const distanceX = slimeCenterX - closestX;
                    const distanceY = slimeCenterY - closestY;
                    const distance = Math.sqrt(distanceX * distanceX + distanceY * distanceY);
                    if (distance < slimeRadius) {
                        return true;
                    }
                }
                return false;
            }

            function checkBucketCollision() {
                const slimeCenterX = slime.x + slime.width / 2;
                const slimeCenterY = slime.y + slime.height / 2;
                const slimeRadius = slime.width / 2;

                for (let i of buckets) {
                    const closestX = Math.max(i.x, Math.min(slimeCenterX, i.x + i.width));
                    const closestY = Math.max(i.y, Math.min(slimeCenterY, i.y + i.height));
                    const distanceX = slimeCenterX - closestX;
                    const distanceY = slimeCenterY - closestY;
                    const distance = Math.sqrt(distanceX * distanceX + distanceY * distanceY);
                    if (distance < slimeRadius) {
                        if (i.type === "green") {
                            power = undefined;
                        } else if (i.type.startsWith("happy_")) {
                            if (!startpowers.includes(i.type)) {
                                startpowers.push(i.type);
                                saveStartpowers(); // <--- Hinzugefügt
                            }
                        } else {
                            power = i.type;
                        }
                        buckets.splice(buckets.indexOf(i), 1);
                        return true;
                    }
                }
                return false;
            }

            function openFullscreen() {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen();
                }
            }

            let rainbowDoubleJumpAvailable = false;

            // Dash-Reset bei Sprung entfernen
            function handleJump() {
                if (!slime.isJumping && gameRunning && !gamePaused) {
                    slime.velocity = slime.jumpPower;
                    slime.isJumping = true;
                    if (power === "rainbow") {
                        rainbowDoubleJumpAvailable = true;
                        // dashAvailable = true;
                        // dashCooldown = 0;
                    }
                } else if (
                    power === "rainbow" &&
                    rainbowDoubleJumpAvailable &&
                    gameRunning &&
                    !gamePaused
                ) {
                    slime.velocity = slime.jumpPower;
                    rainbowDoubleJumpAvailable = false;
                }
            }

            // Dash-Cooldown im Game-Loop
            function gameLoop() {
                if (!gameRunning || gamePaused) return;
                
                ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

                backgroundX -= (power === "lila" ? 2 : power === "blue" ? 8 : 4) * (isMobile ? 2 : 1);
                ctx.drawImage(backgroundImg, backgroundX, 0, GAME_WIDTH, GAME_HEIGHT);
                ctx.drawImage(backgroundImg, backgroundX + GAME_WIDTH, 0, GAME_WIDTH, GAME_HEIGHT);
                if (backgroundX <= -GAME_WIDTH) {
                    backgroundX = 0;
                }

                ctx.save();
                ctx.translate(slime.x + slime.width / 2, slime.y + slime.height / 2);
                slime.rotation += power === "lila" ? 0.05 : power === "blue" ? 0.2 : 0.1;
                ctx.rotate(slime.rotation);
                ctx.drawImage(power ? slimeImgs[power] : slimeImage, -slime.width / 2, -slime.height / 2, slime.width, slime.height);
                ctx.restore();

                for (let i of hindernisse) {
                    i.x -= (power === "lila" ? 2 : power === "blue" ? 8 : 4) * (isMobile ? 2 : 1);
                    ctx.drawImage(i.type ? hindernisImgs[i.type] : hindernisImg, i.x, i.y, i.width, i.height);
                }
                for (let i = hindernisse.length - 1; i >= 0; i--) {
                    if (hindernisse[i].x + hindernisse[i].width < 0) {
                        hindernisse.splice(i, 1);
                        points += (power === "yellow" ? 5 : 1);
                        updateScore();
                    }
                }

                for (i of buckets) {
                    ctx.drawImage(bucketImgs[i.type], i.x, i.y, i.width, i.height);
                    i.x -= (power === "lila" ? 2 : power === "blue" ? 8 : 4) * (isMobile ? 2 : 1);
                }

                slime.velocity += slime.gravity * (power === "lila" ? 0.5 : power === "blue" ? 2 : 1);
                slime.y += slime.velocity * (power === "lila" ? 0.5 : power === "blue" ? 2 : 1);

                if (slime.y > ground) {
                    slime.y = ground;
                    slime.velocity = 0;
                    slime.isJumping = false;
                    rainbowDoubleJumpAvailable = false;
                }

                if (Math.random() < 0.5 && runner % (power === "lila" ? 150 : 75) === 0) {
                    hindernisse.push({
                        y: GAME_HEIGHT - (power === "red" ? (isMobile ? 250 : 270) : 300) - (isMobile ? 45 : 0),
                        x: GAME_WIDTH,
                        width: (power === "red" ? 30 : 60) * (isMobile ? 2 : 1),
                        height: (power === "red" ? 30 : 60) * (isMobile ? 2 : 1),
                        type: Math.random() < 0.3 ? "cactus" : undefined
                    });
                }

                if (Math.random() < 0.001) {
                    let bucketType = new Array("red", "blue", "lila")[Math.floor(Math.random() * 3)];
                    if (Math.random() < 0.01) {
                        bucketType = "rainbow"
                    }
                    if (Math.random() < 0.01) {
                        bucketType = "happy_" + bucketType;
                        if (Math.random() < 0.01) {
                            bucketType = "yellow";
                            if (Math.random() < 0.001) {
                                bucketType = "happy_yellow";
                            }
                        }
                    }
                    if (bucketType === power) bucketType = "green"
                    buckets.push({
                        x: GAME_WIDTH,
                        y: GAME_HEIGHT - (power === "red" ? (isMobile ? 250 : 270) : 300)  - (isMobile ? 45 : 0),
                        width: (power === "red" ? 30 : 60) * (isMobile ? 2 : 1),
                        height: (power === "red" ? 30 : 60) * (isMobile ? 2 : 1),
                        type: bucketType
                    });
                }

                if (checkCollision()) {
                    gameOver();
                    return;
                }

                checkBucketCollision();

                runner++;
                requestAnimationFrame(gameLoop);
            }

            let selectedStartPower = undefined;

            function updatePowerSelect(containerId) {
                const container = $(containerId);
                container.innerHTML = "";
                if (startpowers.length > 0) {
                    container.style.display = "flex";
                    startpowers.forEach(type => {
                        const img = document.createElement("img");
                        img.src = slimeImgs[type] ? slimeImgs[type].src : bucketImgs[type.replace("happy_", "")]?.src;
                        img.alt = type;
                        img.style.width = "60px";
                        img.style.height = "60px";
                        img.style.border = selectedStartPower === type ? "4px solid #4caf50" : "2px solid #222";
                        img.style.borderRadius = "50%";
                        img.style.background = "#111";
                        img.style.cursor = "pointer";
                        img.onclick = () => {
                            selectedStartPower = type;
                            updatePowerSelect("powerSelectContainer");
                            updatePowerSelect("powerSelectContainerGameOver");
                        };
                        container.appendChild(img);
                    });
                } else {
                    container.style.display = "none";
                }
            }

            function startGame() {
                slime.y = ground;
                slime.velocity = 0;
                slime.isJumping = false;
                slime.rotation = 0;
                hindernisse = [];
                buckets = [];
                power = selectedStartPower || undefined;
                points = 0;
                runner = 0;
                backgroundX = 0;

                updateScore();

                startScreen.style.display = "none";
                gameOverScreen.style.display = "none";
                pauseMenu.style.display = "none";

                scoreDisplay.style.display = "block";
                homeButton.style.display = "block";
                pauseButton.style.display = "block";

                gameRunning = true;
                gamePaused = false;
                gameLoop();
                dashAvailable = false;
                dashCooldown = 0;
                rainbowDoubleJumpAvailable = false;
            }

            function showStartScreen() {
                loadStartpowers(); // <--- Hinzugefügt
                startScreen.style.display = "flex";
                updatePowerSelect("powerSelectContainer");
            }

            function showGameOverScreen() {
                loadStartpowers();
                loadHighscore();
                gameOverScreen.style.display = "flex";
                updatePowerSelect("powerSelectContainerGameOver");
            }

            function gameOver() {
                gameRunning = false;
                gamePaused = false;
                // Highscore prüfen und ggf. aktualisieren
                if (points > highscore) {
                    highscore = points;
                    saveHighscore();
                }
                scoreText.textContent = `Punkte: ${points}\nHighscore: ${highscore}`;
                scoreDisplay.style.display = "none";
                homeButton.style.display = "none";
                pauseButton.style.display = "none";
                pauseMenu.style.display = "none";
                showGameOverScreen();
            }

            homeButton.addEventListener("click", () => {
                if (gameRunning || gamePaused) {
                    gameRunning = false;
                    gamePaused = false;
                    pauseMenu.style.display = "none";
                    scoreDisplay.style.display = "none";
                    homeButton.style.display = "none";
                    pauseButton.style.display = "none";
                    showStartScreen();
                    gameOverScreen.style.display = "none";
                }
            });

            pauseHomeButton.addEventListener("click", () => {
                pauseMenu.style.display = "none";
                gamePaused = false;
                gameRunning = false;
                scoreDisplay.style.display = "none";
                homeButton.style.display = "none";
                pauseButton.style.display = "none";
                showStartScreen();
                gameOverScreen.style.display = "none";
            });

            startButton.addEventListener("click", startGame);
            restartButton.addEventListener("click", startGame);

            showStartScreen();

            function handleJump() {
                if (!slime.isJumping && gameRunning && !gamePaused) {
                    slime.velocity = slime.jumpPower;
                    slime.isJumping = true;
                    if (power === "rainbow") {
                        rainbowDoubleJumpAvailable = true;
                        // dashAvailable = true;
                        // dashCooldown = 0;
                    }
                } else if (
                    power === "rainbow" &&
                    rainbowDoubleJumpAvailable &&
                    gameRunning &&
                    !gamePaused
                ) {
                    slime.velocity = slime.jumpPower;
                    rainbowDoubleJumpAvailable = false;
                }
            }

            function updateScore() {
                scoreDisplay.textContent = `Punkte: ${points}`;
            }

            function pauseGame() {
                gamePaused = true;
                pauseMenu.style.display = "flex";
            }

            function resumeGame() {
                if (gamePaused) {
                    gamePaused = false;
                    pauseMenu.style.display = "none";
                    gameLoop();
                }
            }

            // LocalStorage laden
            function loadStartpowers() {
                const saved = localStorage.getItem("slimeSprintStartpowers");
                if (saved) {
                    try {
                        startpowers = JSON.parse(saved);
                    } catch (e) {
                        startpowers = [];
                    }
                }
            }

            // LocalStorage speichern
            function saveStartpowers() {
                localStorage.setItem("slimeSprintStartpowers", JSON.stringify(startpowers));
            }

            // Highscore aus LocalStorage laden
            function loadHighscore() {
                const saved = localStorage.getItem("slimeSprintHighscore");
                highscore = saved ? parseInt(saved) : 0;
            }
            
            // Highscore speichern
            function saveHighscore() {
                localStorage.setItem("slimeSprintHighscore", highscore);
            }

            window.addEventListener("keydown", (e) => {
                if (e.code === "Space") {
                    handleJump();
                    e.preventDefault();
                } else if (e.code === "KeyP") {
                    if (gameRunning && !gamePaused) {
                        pauseGame();
                    } else if (gamePaused) {
                        resumeGame();
                    }
                    e.preventDefault();
                }
            });

            startButton.addEventListener("click", startGame);
            restartButton.addEventListener("click", startGame);

            // Initial laden beim Start
loadStartpowers();
loadHighscore();

            showStartScreen();
        </script>
    </body>
</html>
